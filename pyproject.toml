[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "var", "eval_kit_v1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
files = ["caseproof/domain", "caseproof/graph", "caseproof/pipeline"]
