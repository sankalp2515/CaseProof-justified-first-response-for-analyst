name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Frontend service images (local and cloud profiles)
        run: |
          docker build -t caseproof-frontend:ci .
          docker build --build-arg FRONTEND_PROFILE=cloud \
            --build-arg VITE_GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com \
            -t caseproof-frontend-cloud:ci .
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t caseproof-tests .
      - name: Offline full regression
        run: >-
          docker run --rm --network none
          -e DATA_DIR=/tmp/tests -e SQLITE_URL=sqlite:////tmp/tests/cases.db
          -e DUCKDB_PATH=/tmp/tests/bank.duckdb -e OBJECT_DIR=/tmp/tests/objects
          -e LLM_PROVIDER=gemini -e LLM_MODE=live -e CUSTOMER_PORTAL=false
          caseproof-tests python -m pytest -q --basetemp=/tmp/pytest
          -o cache_dir=/tmp/pytest-cache
      - run: docker compose config --quiet
